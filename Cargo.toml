[package]
name = "questdisplay"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "LAN WebRTC display streaming host"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls"] }
bytes = "1"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
dirs = "6"
fast_image_resize = "6.1.0"
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
local-ip-address = "0.6"
openh264 = "0.9.8"
opus = "0.4"
qrcode = "0.14"
rand = "0.9"
rtc = "0.21.0"
rcgen = "0.14"
rustls = "0.23"
scrcap = "0.1.0-alpha.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
base64 = "0.22"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
webrtc = "0.21.0"
