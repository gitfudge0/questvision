name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux native build headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev cmake pkg-config libpipewire-0.3-dev libspa-0.2-dev libdbus-1-dev
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check CMake source prerequisite
        run: cmake --version
      - name: Format
        run: cargo fmt --all -- --check
      - name: Build
        run: cargo build --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked

# Hosted runners have no consent-capable display session. This workflow checks
# compilation and headless tests only; physical capture and Quest tests remain manual.
